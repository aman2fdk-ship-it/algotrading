[pytest]
# Run async fixtures on a per-function event loop (pytest-asyncio strict mode
# already runs each test on its own function-scoped loop).  The integration
# fixtures are function-scoped and create/dispose their engine entirely within
# one test's loop, so an engine's asyncpg/aiosqlite connections are always
# created, used and closed on the same loop -- no cross-loop reuse, no "Future
# attached to a different loop" errors.
asyncio_default_fixture_loop_scope = function
